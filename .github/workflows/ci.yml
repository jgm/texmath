name: CI tests

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        versions:
          - ghc: '9.6'
            cabal: 'latest'
            cabalopts: '--ghc-option=-Werror'
          - ghc: '9.8'
            cabal: 'latest'
            cabalopts: '--ghc-option=-Werror'
          - ghc: '9.10'
            cabal: 'latest'
            cabalopts: '--ghc-option=-Werror'
          - ghc: '9.12'
            cabal: 'latest'
            cabalopts: '--ghc-option=-Werror'
          - ghc: '9.14'
            cabal: 'latest'
            cabalopts: '--ghc-option=-Werror'

    steps:
    - uses: actions/checkout@v7
    - name: Resolve GHC version
      id:   ghc
      shell: bash
      run: |
          version=$(ghcup list -t ghc -c available -r | awk -v prefix="${{ matrix.versions.ghc }}." 'index($2, prefix) == 1 { print $2 }' | sort -V | tail -1)
          test -n "$version"
          dir="$(ghcup whereis basedir)/ghc/$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "preinstalled=$(test -d "$dir" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "os=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"

    - name: Cache GHC installation
      if:   steps.ghc.outputs.preinstalled != 'true'
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.ghc.outputs.dir }}
        key: ${{ steps.ghc.outputs.os }}-ghc-install-${{ secrets.CACHE_VERSION }}-${{ steps.ghc.outputs.version }}

    - name: Install cabal/ghc
      run: |
        ghcup install ghc ${{ steps.ghc.outputs.version }}
        ghcup set ghc ${{ steps.ghc.outputs.version }}
        ghcup install cabal --set ${{ matrix.versions.cabal }}

    - name: Update cabal and get store path
      id:   cabal-store
      shell: bash
      run: |
          cabal update -z
          echo "dir=$(cabal path -z --store-dir)" >> "$GITHUB_OUTPUT"

    - name: Compute build plan
      run: |
          cabal build --enable-tests --disable-optimization -fexecutable ${{ matrix.versions.cabalopts }} --dry-run

    - name: Cache cabal global package db
      id:   cabal-global
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.cabal-store.outputs.dir }}
        key: ${{ runner.os }}-ghc-${{ matrix.versions.ghc }}-cabal-${{ secrets.CACHE_VERSION }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
        restore-keys: |
          ${{ runner.os }}-ghc-${{ matrix.versions.ghc }}-cabal-${{ secrets.CACHE_VERSION }}-

    - name: Build
      run: |
          cabal build --enable-tests --disable-optimization -fexecutable ${{ matrix.versions.cabalopts }}

    - name: Test
      run: |
          cabal test --disable-optimization ${{ matrix.versions.cabalopts }}

  windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    # Use the versions of cabal and ghc that are included in the runner image.
    - name: Update cabal and get versions and store path
      id:   cabal-store
      shell: bash
      run: |
          cabal update -z
          echo "ghc=$(ghc --numeric-version)" >> "$GITHUB_OUTPUT"
          echo "dir=$(cabal path -z --store-dir)" >> "$GITHUB_OUTPUT"

    - name: Compute build plan
      run: |
          cabal build --enable-tests --disable-optimization -fexecutable --ghc-option=-Werror --dry-run

    - name: Cache cabal global package db
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.cabal-store.outputs.dir }}
        key: ${{ runner.os }}-ghc-${{ steps.cabal-store.outputs.ghc }}-cabal-${{ secrets.CACHE_VERSION }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
        restore-keys: |
          ${{ runner.os }}-ghc-${{ steps.cabal-store.outputs.ghc }}-cabal-${{ secrets.CACHE_VERSION }}-

    - name: Build
      run: |
          cabal build --enable-tests --disable-optimization -fexecutable --ghc-option=-Werror

    - name: Test
      run: |
          cabal test --disable-optimization --ghc-option=-Werror

